<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" role="img" aria-labelledby="t d"><title id="t">带走这几个要点</title><desc id="d">第8页：总结</desc><rect width="100%" height="100%" fill="#F7F4EE"/><circle cx="960" cy="130" r="90" fill="#D77952" opacity=".22"/><text x="84" y="100" font-family="Arial, &#x27;Noto Sans CJK SC&#x27;, sans-serif" font-size="25" fill="#D77952">内容卡片 · 08/08</text><text x="84" y="210" font-family="Arial, &#x27;Noto Sans CJK SC&#x27;, sans-serif" font-size="26" fill="#20332D">总结</text><text x="84" y="330" font-size="54" font-weight="700" fill="#20332D">带走这几个要点</text><text x="104" y="600" font-size="31" fill="#20332D">窗台香草种植怎么开始？买苗前先记下这三件事</text><text x="104" y="666" font-size="31" fill="#20332D">你也可以把自己的观察记成“上午有直射光 / </text><text x="104" y="732" font-size="31" fill="#20332D">下午被遮挡”这类描述，再用来查资料</text><text x="104" y="798" font-size="31" fill="#20332D">观察后可以先留一条记录，不急着得出结论</text><text x="104" y="864" font-size="31" fill="#20332D">#窗台种植</text><text x="104" y="930" font-size="31" fill="#20332D">#香草种植</text><path d="M84 1270h912" stroke="#D77952" stroke-width="3"/><text x="84" y="1340" font-family="Arial, &#x27;Noto Sans CJK SC&#x27;, sans-serif" font-size="20" fill="#20332D">页面内容来自当前已批准正文 · 无外部图片依赖</text></svg>