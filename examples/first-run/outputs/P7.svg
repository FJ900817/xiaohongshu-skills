<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" role="img" aria-labelledby="t d"><title id="t">按步骤试一遍</title><desc id="d">第7页：执行步骤</desc><rect width="100%" height="100%" fill="#F7F4EE"/><circle cx="960" cy="130" r="90" fill="#D77952" opacity=".22"/><text x="84" y="100" font-family="Arial, &#x27;Noto Sans CJK SC&#x27;, sans-serif" font-size="25" fill="#D77952">内容卡片 · 07/08</text><text x="84" y="210" font-family="Arial, &#x27;Noto Sans CJK SC&#x27;, sans-serif" font-size="26" fill="#20332D">执行步骤</text><text x="84" y="330" font-size="54" font-weight="700" fill="#20332D">按步骤试一遍</text><text x="104" y="600" font-size="31" fill="#20332D">窗台香草种植没有适用于每个房间的统一答案，先</text><text x="104" y="666" font-size="31" fill="#20332D">了解位置条件，比直接照搬别人的摆放方式更稳妥</text><text x="104" y="732" font-size="31" fill="#20332D">你也可以把自己的观察记成“上午有直射光 / </text><text x="104" y="798" font-size="31" fill="#20332D">下午被遮挡”这类描述，再用来查资料</text><text x="104" y="864" font-size="31" fill="#20332D">观察后可以先留一条记录，不急着得出结论</text><path d="M84 1270h912" stroke="#D77952" stroke-width="3"/><text x="84" y="1340" font-family="Arial, &#x27;Noto Sans CJK SC&#x27;, sans-serif" font-size="20" fill="#20332D">页面内容来自当前已批准正文 · 无外部图片依赖</text></svg>