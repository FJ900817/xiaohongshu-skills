<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" role="img" aria-labelledby="t d"><title id="t">需要留意的情况</title><desc id="d">第4页：常见问题</desc><rect width="100%" height="100%" fill="#F7F4EE"/><circle cx="960" cy="130" r="90" fill="#D77952" opacity=".22"/><text x="84" y="100" font-family="Arial, &#x27;Noto Sans CJK SC&#x27;, sans-serif" font-size="25" fill="#D77952">内容卡片 · 04/08</text><text x="84" y="210" font-family="Arial, &#x27;Noto Sans CJK SC&#x27;, sans-serif" font-size="26" fill="#20332D">常见问题</text><text x="84" y="330" font-size="54" font-weight="700" fill="#20332D">需要留意的情况</text><text x="104" y="600" font-size="31" fill="#20332D">第一件事，选几个固定时段看窗边：早上、接近中</text><text x="104" y="666" font-size="31" fill="#20332D">午、下午各观察一次，记下有没有直射光、光线是</text><text x="104" y="732" font-size="31" fill="#20332D">否被楼体或窗帘挡住</text><text x="104" y="798" font-size="31" fill="#20332D">这个窗台光照观察不是在测精确日照时长，只是比</text><text x="104" y="864" font-size="31" fill="#20332D">较一天里光线变化</text><path d="M84 1270h912" stroke="#D77952" stroke-width="3"/><text x="84" y="1340" font-family="Arial, &#x27;Noto Sans CJK SC&#x27;, sans-serif" font-size="20" fill="#20332D">页面内容来自当前已批准正文 · 无外部图片依赖</text></svg>