<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" role="img" aria-labelledby="t d"><title id="t">把内容整理成框架</title><desc id="d">第3页：核心框架</desc><rect width="100%" height="100%" fill="#F7F4EE"/><circle cx="960" cy="130" r="90" fill="#D77952" opacity=".22"/><text x="84" y="100" font-family="Arial, &#x27;Noto Sans CJK SC&#x27;, sans-serif" font-size="25" fill="#D77952">内容卡片 · 03/08</text><text x="84" y="210" font-family="Arial, &#x27;Noto Sans CJK SC&#x27;, sans-serif" font-size="26" fill="#20332D">核心框架</text><text x="84" y="330" font-size="54" font-weight="700" fill="#20332D">把内容整理成框架</text><text x="104" y="600" font-size="31" fill="#20332D">不同房间的朝向、遮挡和季节都不一样，先把自己</text><text x="104" y="666" font-size="31" fill="#20332D">的位置观察清楚，之后查具体品种要求会更有依据</text><text x="104" y="732" font-size="31" fill="#20332D">香草种植新手可以从描述环境开始，而不是先猜哪</text><text x="104" y="798" font-size="31" fill="#20332D">种植物一定适合</text><text x="104" y="864" font-size="31" fill="#20332D">第一件事，选几个固定时段看窗边：早上、接近中</text><text x="104" y="930" font-size="31" fill="#20332D">午、下午各观察一次，记下有没有直射光、光线是</text><text x="104" y="996" font-size="31" fill="#20332D">否被楼体或窗帘挡住</text><path d="M84 1270h912" stroke="#D77952" stroke-width="3"/><text x="84" y="1340" font-family="Arial, &#x27;Noto Sans CJK SC&#x27;, sans-serif" font-size="20" fill="#20332D">页面内容来自当前已批准正文 · 无外部图片依赖</text></svg>