<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" role="img" aria-labelledby="title desc">
  <title id="title">学习桌面整理：三个小步骤</title>
  <desc id="desc">完全合成的几何排版演示页面，不含真实人物、商标、图片或外部字体。</desc>
  <rect width="1080" height="1440" fill="#f5f0e7"/>
  <circle cx="880" cy="250" r="130" fill="#d9e5d0"/>
  <text x="92" y="170" font-family="sans-serif" font-size="36" fill="#364238">SYNTHETIC DEMO · 01</text>
  <text x="92" y="390" font-family="sans-serif" font-size="76" font-weight="700" fill="#25362c">学习桌面</text>
  <text x="92" y="490" font-family="sans-serif" font-size="76" font-weight="700" fill="#25362c">总是乱？</text>
  <text x="92" y="620" font-family="sans-serif" font-size="48" fill="#49624e">先做这三个小整理</text>
  <path d="M92 760h896" stroke="#9aa78f" stroke-width="3"/>
  <text x="112" y="880" font-family="sans-serif" font-size="42" fill="#25362c">01  移开暂时不用的物品</text>
  <text x="112" y="990" font-family="sans-serif" font-size="42" fill="#25362c">02  给常用物品划位置</text>
  <text x="112" y="1100" font-family="sans-serif" font-size="42" fill="#25362c">03  两分钟归位</text>
  <text x="92" y="1320" font-family="sans-serif" font-size="28" fill="#526055">合成示例｜按真实桌面情况调整</text>
</svg>
