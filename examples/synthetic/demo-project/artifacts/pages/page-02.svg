<title id="title">先分清“每天用”和“偶尔用”</title><desc id="desc">合成家居整理演示页 2/8，无真实品牌素材。</desc>
<rect width="1080" height="1440" fill="#F4F0E8"/><circle cx="900" cy="180" r="115" fill="#73836D" opacity=".22"/>
<text x="88" y="118" font-family="sans-serif" font-size="30" fill="#73836D">SYNTHETIC HOME GUIDE · 02/08</text>
<text x="88" y="300" font-family="sans-serif" font-size="66" font-weight="700" fill="#26352E">先分清“每天用”和“偶尔用”</text>
<text x="88" y="430" font-size="42" fill="#26352E">常用物品：顺手、好拿</text><text x="88" y="518" font-size="42" fill="#26352E">偶尔用品：收在不挡路处</text><text x="88" y="606" font-size="42" fill="#26352E">不要把过道变成临时仓库</text><path d="M88 1190h904" stroke="#73836D" stroke-width="3"/><text x="88" y="1280" font-family="sans-serif" font-size="25" fill="#26352E">合成演示内容｜请按实际户型自行调整</text></svg>